[package]
name = "herdr-worktrunk"
# The version of the last release (YYYY.M.N): the workflow release-pr writes it.
version = "2026.11.35"
edition = "2021"
# The oldest toolchain that the cargo fallback of scripts/install.sh supports.
# File::try_lock (the single observer) needs 1.89.
rust-version = "1.89"
description = "herdr plugin: worktrees that live and die with the work, from the first commit to the merged pull request"
license = "MIT"
repository = "https://github.com/owpac/herdr-worktrunk"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The config of herdr, for the colors of its theme (src/theme.rs).
toml = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
