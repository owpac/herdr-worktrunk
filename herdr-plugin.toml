id = "herdr-worktrunk"
name = "Worktrunk"
# The version of a release: YYYY.M.N. On main, the version stays 0.0.0. The release workflow
# writes the version in the commit of the tag of each release.
version = "2026.11.20"
min_herdr_version = "0.9.0"
description = "Worktrees that live and die with the work, from the first commit to the merged pull request"
platforms = ["linux", "macos"]

# scripts/install.sh puts the binary at bin/herdr-worktrunk: the release binary of this version,
# or a cargo build.
[[build]]
command = ["sh", "scripts/install.sh"]

# The observer: it moves the pane of an agent to the workspace of its worktree, and closes the
# workspace of a removed worktree. With `prune_merged = true`, it also removes the worktree of
# each merged or closed pull request. `observe = false` in config.toml stops it. config.toml is also read by
# the agents (agent_mode): see the README.
# `observe` starts the observer in the background and returns. herdr runs [[startup]] when the
# server starts, but not when the plugin is installed or linked: the event pane.agent_detected
# also starts the observer. A lock keeps one observer for each herdr server. `observe` also gives
# the path of its binary to a running observer (file observer.binary): herdr installs each version
# in a new folder, so the observer runs the binary of the last `observe` command.
[[startup]]
command = ["bin/herdr-worktrunk", "observe"]

[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-worktrunk", "observe"]

[[actions]]
id = "pick"
title = "Worktree: pick or create"
description = "Open the worktree picker: Enter opens or creates a worktree, ⌫ on an empty filter removes one, Tab changes the preview"
contexts = ["global"]
command = ["bin/herdr-worktrunk", "open", "picker"]

[[actions]]
id = "remove"
title = "Worktree: remove this worktree"
description = "Remove the worktree of the focused workspace with wt remove, after a question"
contexts = ["global"]
command = ["bin/herdr-worktrunk", "open", "remover"]

[[actions]]
id = "merge"
title = "Worktree: merge this worktree"
description = "Merge the worktree of the focused workspace into the default branch with wt merge, then remove it"
contexts = ["global"]
command = ["bin/herdr-worktrunk", "open", "merger"]

[[actions]]
id = "clean"
title = "Worktree: clean the old worktrees"
description = "List the worktrees without pull request and without change for some days, in all the repositories of the workspaces: Enter deletes one, ctrl-a deletes all"
contexts = ["global"]
command = ["bin/herdr-worktrunk", "open", "cleaner"]

# herdr starts a plugin pane in the folder of the workspace (--cwd). As for an action, herdr finds
# bin/herdr-worktrunk in the plugin root.
# The large popups (picker, cleaner, merger) have the size of the popup of herdr-bar. With
# popup_size = "big" in config.toml, the plugin opens their pane <id>-big: 90 % × 80 %.
[[panes]]
id = "picker"
title = "Worktrunk"
placement = "popup"
width = "74%"
height = "62%"
command = ["bin/herdr-worktrunk", "pick"]

[[panes]]
id = "picker-big"
title = "Worktrunk"
placement = "popup"
width = "90%"
height = "80%"
command = ["bin/herdr-worktrunk", "pick"]

# The list of the old worktrees without pull request: the action clean, or the daily pass of the
# observer (stale_days). A deletion goes through the popup confirm, then the list comes back.
[[panes]]
id = "cleaner"
title = "Worktrunk: clean"
placement = "popup"
width = "74%"
height = "62%"
command = ["bin/herdr-worktrunk", "cleaner"]

[[panes]]
id = "cleaner-big"
title = "Worktrunk: clean"
placement = "popup"
width = "90%"
height = "80%"
command = ["bin/herdr-worktrunk", "cleaner"]

# The question before a deletion or a merge. herdr shows one popup at a time: the picker closes,
# this popup asks, then the picker comes back.
[[panes]]
id = "confirm"
title = "Worktrunk"
placement = "popup"
width = 64
height = 12
command = ["bin/herdr-worktrunk", "confirm"]

# The output of wt merge.
[[panes]]
id = "merger"
title = "Worktrunk: merge"
placement = "popup"
width = "74%"
height = "62%"
command = ["bin/herdr-worktrunk", "merger"]

[[panes]]
id = "merger-big"
title = "Worktrunk: merge"
placement = "popup"
width = "90%"
height = "80%"
command = ["bin/herdr-worktrunk", "merger"]

# A small popup with a message and an OK button: an action opens it when its popup cannot work,
# for example the picker outside a git repository.
[[panes]]
id = "message"
title = "Worktrunk"
placement = "popup"
width = 64
height = 10
command = ["bin/herdr-worktrunk", "message"]
