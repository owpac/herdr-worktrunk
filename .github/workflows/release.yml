# Release the version of main, after the merge of the pull request "chore: release YYYY.M.N".
#
# The workflow release-pr opens this pull request: it writes the version in herdr-plugin.toml,
# Cargo.toml and Cargo.lock, and the section of this version in CHANGELOG.md. herdr reads the
# version in herdr-plugin.toml, and scripts/install.sh downloads the release of this version. The
# dotfiles install a tag: `herdr plugin install owpac/herdr-worktrunk --ref <tag>`.
#
# A push to main releases the version of herdr-plugin.toml if this version has no tag. The tag
# points to this commit of main. The job publish pushes the tag only after all the builds
# succeed, and the notes of the release are the section of CHANGELOG.md. A push to main with a
# released version releases nothing.
#
# A tag that GITHUB_TOKEN pushes does not start other workflows. Thus this workflow also builds
# and publishes the binaries. Do not change the names of the assets: scripts/install.sh
# downloads them.
#   herdr-worktrunk-<os>-<arch>   os: linux or macos, arch: x86_64 or aarch64
#   SHA256SUMS               "<sha256>  <asset name>" for each binary
name: release

on:
  push:
    branches: [main]
  # A pull request builds each asset, but publishes nothing.
  pull_request:

permissions:
  contents: read

# One release at a time: two runs must not read the same last tag. The pull requests have their
# own group, so that they never cancel a release that waits.
concurrency:
  group: release-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      # fetch-depth 0 also fetches the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the version to release
        id: version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' herdr-plugin.toml | head -n 1)
          tag_commit=$(git rev-parse -q --verify "refs/tags/$version^{commit}" || true)
          if [ "$version" = 0.0.0 ]; then
            echo "main has no version yet: no release."
            release=false
          elif [ -z "$tag_commit" ]; then
            echo "The version $version has no tag: release it."
            release=true
          elif [ "$tag_commit" = "$(git rev-parse HEAD)" ]; then
            # A re-run of the same push: finish the release.
            echo "The tag $version points to this commit: finish its release."
            release=true
          else
            echo "The version $version is already released: no release."
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Run for a release, or when the job version did not run (pull request).
    if: ${{ !cancelled() && (needs.version.outputs.release == 'true' || needs.version.result == 'skipped') }}
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The musl targets link statically, so the binary runs on each Linux distribution.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: herdr-worktrunk-linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: herdr-worktrunk-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: herdr-worktrunk-macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: herdr-worktrunk-macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # mise installs the Rust toolchain of mise.toml. A release does not use the cache of
      # the CI: each build installs a new toolchain.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: rust
          cache: false
      - name: Add the target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Stage the asset
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/herdr-worktrunk" "dist/$ASSET"
      - name: Check the static link
        if: contains(matrix.target, 'linux-musl')
        env:
          ASSET: ${{ matrix.asset }}
        run: file "dist/$ASSET" | grep -Eq 'statically linked|static-pie linked'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Push the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "The tag $VERSION exists."
          else
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
            echo "Tagged $VERSION"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          set -- herdr-worktrunk-linux-x86_64 herdr-worktrunk-linux-aarch64 herdr-worktrunk-macos-x86_64 herdr-worktrunk-macos-aarch64
          for asset in "$@"; do
            test -f "$asset" || { echo "missing $asset" >&2; exit 1; }
          done
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS
      # Create a draft, upload all the assets, then publish: nobody downloads a partial release.
      # A published release keeps its assets. If a run fails after the creation of the draft,
      # a re-run of the same push fills this draft.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.version }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "The release $TAG is already published: its assets stay." >&2
              exit 0
            fi
          else
            # The notes: the section of this version in CHANGELOG.md, without its title.
            awk -v title="## [$TAG]" '
              index($0, title) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "Release $TAG." > notes.md
            fi
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
